# Este archivo se incluye dentro del bloque http de la imagen oficial Nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Docker resuelve otra vez los destinos despues de recrear un contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $supply_api http://api:8080;
    set $supply_frontend http://frontend:5173;

    location = /__supplyflow/health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"supplyflow-gateway"}';
    }

    location = /__supplyflow/dev {
        alias /usr/share/nginx/supply-dev/index.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /__supplyflow/dev/ {
        return 302 /__supplyflow/dev;
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        client_max_body_size 12m; # RF1: max 8 MiB file base64 + header/lines; no public storage
        proxy_pass $supply_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass $supply_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
