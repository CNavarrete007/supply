# Catálogo de clientes (alta/edición): overlay aditivo. No modifica db, sus volúmenes ni las cuentas existentes.
# Requiere ${SUPPLYFLOW_LOCAL_PRIVATE_DIR}/secrets/catalogwrite-db-password.txt (64 hex) y aprovisionar una vez con:
#   docker compose ... -f compose.supply-catalogwrite.yml --profile catalogwrite-tools run --rm catalogwrite-db-tools provision
services:
  api:
    environment:
      CATALOGWRITE_DB_USERNAME: supplyflow_catalogwrite_local
      CATALOGWRITE_DB_PASSWORD_FILE: /run/secrets/catalogwrite_db_password
    secrets:
      - catalogwrite_db_password

  catalogwrite-db-tools:
    profiles: ["catalogwrite-tools"]
    build:
      context: ./docker/supply-dev/db-provision
      dockerfile: Dockerfile
    entrypoint: ["python", "/catalogwrite/provision.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    volumes:
      - type: volume
        source: supplyflow_db_socket
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ./docker/supply-catalogwrite
        target: /catalogwrite
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Requires private local directory}/secrets
        target: /run/supply-secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

secrets:
  catalogwrite_db_password:
    file: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Requires private local directory}/secrets/catalogwrite-db-password.txt
