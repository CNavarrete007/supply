# Additive local-auth overlay. Never changes or recreates the MariaDB service.
services:
  api:
    environment:
      AUTH_DB_USERNAME: supplyflow_auth_local
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
    secrets:
      - auth_db_password

  auth-db-tools:
    profiles: ["auth-tools"]
    build:
      context: ./docker/supply-dev/db-provision
      dockerfile: Dockerfile
    entrypoint: ["python", "/auth/auth_tool.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    volumes:
      - type: volume
        source: supplyflow_db_socket
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ./docker/supply-db
        target: /foundation
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/supply-auth
        target: /auth
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Requires local private directory}/secrets
        target: /run/supply-secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

secrets:
  auth_db_password:
    file: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Requires local private directory}/secrets/auth-db-password.txt
