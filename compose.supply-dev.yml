# DEV local: tercer archivo, despues del Compose original y compose.supply-db.yml.
# Requiere Docker Compose >= 2.24.4 para !override; probado el modelo con 5.6.0.
# No redefine db, sus volumenes, su imagen ni sus parametros.
services:
  web:
    profiles: ["dev"]
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    ports: !override
      - "127.0.0.1:8080:80"
    volumes: !override
      - type: bind
        source: ./docker/supply-dev/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/supply-dev/nginx/index.html
        target: /usr/share/nginx/supply-dev/index.html
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__supplyflow/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    profiles: ["dev"]
    build:
      context: ./docker/supply-dev/frontend
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      NPM_CONFIG_CACHE: /tmp/npm-cache
      TZ: UTC
    volumes:
      - type: bind
        source: ./src
        target: /frontend/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./index.html
        target: /frontend/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./vite.config.js
        target: /frontend/vite.config.js
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./package.json
        target: /frontend/package.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./package-lock.json
        target: /frontend/package-lock.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./image_923273.svg
        target: /frontend/image_923273.svg
        read_only: true
        bind:
          create_host_path: false
      - supplyflow_frontend_node_modules:/frontend/node_modules
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    stop_grace_period: 15s

  api:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      CI_ENVIRONMENT: development
      APP_BASE_URL: http://localhost:8080/
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: supplyflow_dev
      DB_USERNAME: supplyflow_api_local
      DB_PASSWORD_FILE: /run/secrets/api_db_password
      TZ: UTC
    secrets:
      - api_db_password
    volumes:
      - type: bind
        source: ./backend/app
        target: /var/www/html/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/public
        target: /var/www/html/public
        read_only: true
        bind:
          create_host_path: false
      - supplyflow_api_writable:/var/www/html/writable
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    stop_grace_period: 15s

  api-db-tools:
    profiles: ["dev-tools"]
    build:
      context: ./docker/supply-dev/db-provision
      dockerfile: Dockerfile
    entrypoint: ["python", "/work/bootstrap.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    volumes:
      - type: volume
        source: supplyflow_db_socket
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ./docker/supply-db
        target: /foundation
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Ejecuta primero la preparacion local}/secrets
        target: /run/supply-secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Ejecuta primero la preparacion local}/evidence
        target: /evidence
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    network_mode: none

volumes:
  supplyflow_frontend_node_modules:
  supplyflow_api_writable:

secrets:
  api_db_password:
    file: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Ejecuta primero la preparacion local}/secrets/api-db-password.txt
