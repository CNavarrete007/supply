# RF1 LOCAL ONLY. Last overlay. No db definitions, no ports and no volume deletions.
services:
  api:
    environment:
      RECOVERY_DB_USERNAME: supplyflow_recovery_local
      RECOVERY_DB_PASSWORD_FILE: /run/secrets/recovery_db_password
    secrets:
      - recovery_db_password
    volumes:
      - type: bind
        source: ./docker/supply-recovery/transport.ini
        target: /usr/local/etc/php/conf.d/zz-rf1.ini
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Private directory required}/imports/cd9a8d0eb37b7c461cc1a269f7eb554d89fd76040963d539e4c3f6fbd8754619/files
        target: /run/supply-import-files
        read_only: true
        bind: { create_host_path: false }
  web:
    volumes:
      - type: bind
        source: ./docker/supply-recovery/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind: { create_host_path: false }
  recovery-db-tools:
    profiles: ["recovery-tools"]
    build:
      context: ./docker/supply-dev/db-provision
      dockerfile: Dockerfile
    entrypoint: ["python", "/recovery/provision.py"]
    environment: { PYTHONDONTWRITEBYTECODE: "1", PYTHONUNBUFFERED: "1", TZ: UTC }
    volumes:
      - type: volume
        source: supplyflow_db_socket
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ./docker/supply-recovery
        target: /recovery
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Private directory required}/secrets
        target: /run/supply-secrets
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    network_mode: none
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  # INT03: cuentas SQL 77/52 para una base YA migrada/restaurada. Perfil explicito, sin red.
  # NO ejecutar recovery-db-tools (38/74) ni auth-db-tools (74/17) sobre una base de 77 tablas.
  int03-accounts-tools:
    profiles: ["int03-tools"]
    build:
      context: ./docker/supply-dev/db-provision
      dockerfile: Dockerfile
    entrypoint: ["python", "/docker/supply-int03/accounts.py"]
    environment: { PYTHONDONTWRITEBYTECODE: "1", PYTHONUNBUFFERED: "1", TZ: UTC }
    volumes:
      - type: volume
        source: supplyflow_db_socket
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ./docker
        target: /docker
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Private directory required}/secrets
        target: /run/supply-secrets
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    network_mode: none
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  # INT03: inspeccion SOLO LECTURA de backups/<archivo>.sql (no imprime datos). Sin red ni base.
  int03-dump-inspect:
    profiles: ["int03-tools"]
    build:
      context: ./docker/supply-dev/db-provision
      dockerfile: Dockerfile
    entrypoint: ["python", "-I", "/docker/supply-int03/dump_inspect.py"]
    environment: { PYTHONDONTWRITEBYTECODE: "1", PYTHONUNBUFFERED: "1", TZ: UTC }
    volumes:
      - type: bind
        source: ./docker
        target: /docker
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Private directory required}/backups
        target: /backups
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    network_mode: none
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  # INT03: restaura un respaldo en un servidor SIN supplyflow_dev. Misma imagen fijada que db,
  # sin red, socket local y backups/ en solo lectura. Nunca sobrescribe una base existente.
  int03-restore-tools:
    profiles: ["int03-tools"]
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    entrypoint: ["sh", "/docker/supply-int03/restore.sh"]
    environment: { TZ: UTC }
    secrets:
      - root_password
    volumes:
      - type: volume
        source: supplyflow_db_socket
        target: /run/mysqld
        read_only: true
      - type: bind
        source: ./docker
        target: /docker
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Private directory required}/backups
        target: /backups
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    network_mode: none
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
secrets:
  recovery_db_password:
    file: ${SUPPLYFLOW_LOCAL_PRIVATE_DIR:?Private directory required}/secrets/recovery-db-password.txt
